name: gh_vault
description: Time-bounded privilege elevation vault and dispatcher for GitHub CLI.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

executables:
  gh: gh_dispatch
  gh-unlock: gh_unlock
  gh-lock: gh_lock

dependencies:
  args: ^2.5.0
  path: ^1.9.0

dev_dependencies:
  checks: ^0.3.0
  dart_flutter_team_lints: ^3.0.0
  test: ^1.25.0
